[project]
name = "telegram-ai-summary"
version = "1.0.0"
description = "Telegram userbot for AI-powered group message summaries"
requires-python = ">=3.10"
dependencies = [
    "telethon>=1.44.0",
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.24.0",
    "rich>=13.0.0",
    "questionary>=2.0.0",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.0.0",
]

[dependency-groups]
dev = []
