[project]
name = "telegram-ai-summary"
version = "0.1.0"
description = "Telegram userbot for AI-powered group message summaries"
requires-python = ">=3.10"
dependencies = [
    "telethon>=1.44.0",
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/telegram_ai_summary"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
